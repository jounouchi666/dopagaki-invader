<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>【脳汁全開】ドパガキ・インベーダー</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Press+Start+2P&family=Yuji+Boku&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="w-screen h-screen flex flex-col items-center justify-between p-2 text-white relative select-none">

  <!-- 背景レインボーオーラ（FEVER時活性化） -->
  <div id="feverBg" class="absolute inset-0 pointer-events-none opacity-0 transition-opacity duration-200 z-0 bg-cover"></div>

  <!-- TOP HUD: ドーパミンメーター ＆ スコア ＆ 確変状態 -->
  <header class="w-full max-w-2xl flex flex-col gap-1 z-10 pt-1">
    <div class="flex justify-between items-center bg-black/60 backdrop-blur-md px-4 py-2 rounded-2xl border-2 border-purple-500/50 shadow-lg">
      <div class="flex items-center gap-2">
        <span class="text-xs text-yellow-400 font-bold tracking-widest">脳汁指数:</span>
        <span id="scoreText" class="text-2xl font-black text-yellow-300 tracking-wider">0</span>
      </div>
      <div id="comboBadge" class="hidden px-3 py-0.5 rounded-full bg-gradient-to-r from-red-600 to-pink-500 text-xs font-black animate-pulse border border-yellow-300 shadow-[0_0_15px_#ff0055]">
        COMBO x<span id="comboText">0</span>
      </div>
      <div class="flex items-center gap-1">
        <span class="text-xs text-pink-400">残基:</span>
        <div id="livesContainer" class="flex gap-1 text-sm text-pink-500">❤️❤️❤️</div>
      </div>
    </div>

    <!-- 脳汁ゲージ (DOPAMINE BURST GAUGE) -->
    <div class="w-full bg-gray-900/80 rounded-full h-4 p-0.5 border border-purple-400/50 relative overflow-hidden shadow-[0_0_10px_#9d00ff]">
      <div id="dopamineBar" class="h-full rounded-full bg-gradient-to-r from-cyan-400 via-pink-500 to-yellow-400 transition-all duration-75 w-0 shadow-[0_0_15px_#00ffff]"></div>
      <span class="absolute inset-0 flex items-center justify-center text-[10px] font-black tracking-widest drop-shadow text-white">
        DOPAMINE GAUGE (<span id="gaugePct">0</span>%)
      </span>
    </div>
  </header>

  <!-- ゲームキャンバスコンテナ -->
  <main id="gameWrapper" class="relative flex-1 w-full max-w-2xl flex items-center justify-center my-1 rounded-2xl overflow-hidden border-2 border-purple-800/60 bg-black/70 shadow-2xl transition-all">
    <canvas id="gameCanvas" class="w-full h-full block"></canvas>

    <!-- スタート / ゲームオーバー / ドパガキ覚醒画面オーバーレイ -->
    <div id="startScreen" class="absolute inset-0 bg-black/85 flex flex-col items-center justify-center gap-4 p-6 z-20 text-center">
      <h1 class="text-4xl md:text-5xl font-black neon-text-rainbow tracking-tighter leading-tight drop-shadow-[0_0_20px_#ff007f]">
        ドパガキ<br>インベーダー
      </h1>
      <p class="text-yellow-300 text-sm md:text-base font-bold bg-purple-950/80 px-4 py-2 rounded-xl border border-yellow-400/60">
        💥 連射！全弾爆散！脳汁を分泌せよ！ 💥
      </p>
      <div class="text-xs text-gray-300 space-y-1">
        <p>🛸 移動: 左右ボタン / スワイプ / [←][→]</p>
        <p>⚡ 撃ちまくれ: 自動超速乱射 または 連打</p>
        <p>🌈 ゲージMAXで脳汁FEVER確変モード発動！</p>
      </div>
      <button id="startBtn" class="mt-4 px-10 py-4 bg-gradient-to-r from-pink-600 via-purple-600 to-yellow-500 rounded-full text-2xl font-black tracking-wider glow-btn border-2 border-yellow-300 text-white cursor-pointer">
        脳汁を出す (START)
      </button>
    </div>

    <!-- FEVER突入カットイン -->
    <div id="feverCutIn" class="absolute inset-0 pointer-events-none flex items-center justify-center z-30 opacity-0 transition-opacity duration-150">
      <div class="text-center transform scale-50 transition-transform duration-200" id="cutInInner">
        <div class="text-6xl md:text-8xl font-black neon-text-rainbow drop-shadow-[0_0_35px_#ff00ff] tracking-widest italic">
          超絶確変!!
        </div>
        <div class="text-3xl md:text-5xl font-black text-yellow-300 tracking-wider mt-2 drop-shadow-[0_0_20px_#ffff00]">
          脳 汁 F E V E R
        </div>
      </div>
    </div>
  </main>

  <!-- スマホ・タッチ操作用 コントロールバー -->
  <footer class="w-full max-w-2xl flex items-center justify-between gap-3 px-2 pb-2 z-10">
    <div class="flex gap-2 flex-1">
      <button id="leftBtn" class="flex-1 py-4 bg-indigo-900/80 active:bg-indigo-600 rounded-2xl text-2xl font-black border-2 border-indigo-400/50 shadow-lg active:scale-95 transition-all text-cyan-300">
        ◀ LEFT
      </button>
      <button id="rightBtn" class="flex-1 py-4 bg-indigo-900/80 active:bg-indigo-600 rounded-2xl text-2xl font-black border-2 border-indigo-400/50 shadow-lg active:scale-95 transition-all text-cyan-300">
        RIGHT ▶
      </button>
    </div>
    <button id="shotBtn" class="px-8 py-4 bg-gradient-to-r from-red-600 to-pink-600 active:from-yellow-400 active:to-red-500 rounded-2xl text-xl font-black border-2 border-pink-300 shadow-[0_0_20px_#ff0055] active:scale-95 transition-all text-white">
      🔥 乱射
    </button>
  </footer>

  <!-- 自作Web Audio API サウンドシステム（パチンコ確定音・脳汁破裂音・FEVERファンファーレ） -->
  <script src="script.js"></script>
</body>
</html>
